<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MG 생활 도우미</title>
  <style>
    :root {
      --blue-950: #052c65;
      --blue-900: #073b84;
      --blue-800: #0b57b8;
      --blue-700: #0868d7;
      --blue-600: #1687e8;
      --blue-100: #eaf5ff;
      --blue-50: #f5faff;
      --text: #17324d;
      --muted: #6b7f93;
      --line: #d9e8f7;
      --white: #ffffff;
      --shadow: 0 14px 40px rgba(15, 78, 140, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(22,135,232,0.16), transparent 32%),
        linear-gradient(180deg, #eef8ff 0%, #f8fbff 55%, #ffffff 100%);
      min-height: 100vh;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 64px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 240px;
      align-items: center;
      gap: 28px;
      min-height: 230px;
      padding: 38px 42px;
      border-radius: 28px;
      color: var(--white);
      background: linear-gradient(135deg, var(--blue-950), var(--blue-700) 70%, var(--blue-600));
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -70px;
      top: -90px;
      width: 280px;
      height: 280px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 50%;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.13);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .hero h1 {
      margin: 14px 0 10px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      max-width: 620px;
      color: rgba(255,255,255,0.84);
      line-height: 1.7;
      font-size: 15px;
    }

    .character-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
    }

    .character-card {
      width: 190px;
      height: 190px;
      border-radius: 28px;
      background: rgba(255,255,255,0.97);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 35px rgba(0, 36, 82, 0.28);
      overflow: hidden;
    }

    .character-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .panel {
      margin-top: 26px;
      padding: 26px;
      border: 1px solid rgba(14,102,188,0.12);
      border-radius: 24px;
      background: rgba(255,255,255,0.92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 58px;
      padding: 0 18px 0 50px;
      border: 2px solid #cfe4f7;
      border-radius: 17px;
      outline: none;
      background: #fbfdff;
      color: var(--text);
      font-size: 16px;
      transition: 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 4px rgba(22,135,232,0.12);
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 21px;
      pointer-events: none;
    }

    .reset-btn {
      height: 58px;
      padding: 0 22px;
      border: 0;
      border-radius: 17px;
      background: var(--blue-800);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .reset-btn:hover { background: var(--blue-950); transform: translateY(-1px); }

    .filter-area { margin-top: 24px; }

    .section-label {
      margin-bottom: 11px;
      font-size: 14px;
      font-weight: 800;
      color: var(--blue-950);
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .category-button {
      border: 1px solid #cfe3f6;
      border-radius: 999px;
      padding: 10px 17px;
      background: var(--white);
      color: #46637e;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .category-button:hover {
      border-color: var(--blue-600);
      color: var(--blue-800);
    }

    .category-button.active {
      border-color: var(--blue-800);
      background: var(--blue-800);
      color: white;
      box-shadow: 0 7px 18px rgba(11,87,184,0.23);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin: 34px 2px 14px;
    }

    .result-header h2 {
      margin: 0;
      color: var(--blue-950);
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    .result-count {
      color: var(--muted);
      font-size: 14px;
    }

    .result-count strong { color: var(--blue-700); }

    .faq-list {
      display: grid;
      gap: 14px;
    }

    .faq-card {
      position: relative;
      padding: 24px 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: white;
      box-shadow: 0 7px 24px rgba(28, 86, 138, 0.07);
    }

    .faq-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 20px;
      bottom: 20px;
      width: 4px;
      border-radius: 0 6px 6px 0;
      background: linear-gradient(var(--blue-600), var(--blue-800));
    }

    .question-label, .answer-label {
      display: inline-block;
      margin-bottom: 6px;
      color: var(--blue-700);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .answer-label { margin-top: 16px; }

    .faq-question {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      color: #122d47;
    }

    .faq-answer {
      margin: 0;
      color: #4d647b;
      line-height: 1.75;
      font-size: 15px;
    }

    .category-badge {
      display: inline-flex;
      margin-top: 18px;
      padding: 6px 10px;
      border-radius: 9px;
      background: var(--blue-100);
      color: var(--blue-800);
      font-size: 12px;
      font-weight: 800;
    }

    mark {
      padding: 1px 3px;
      border-radius: 4px;
      background: #fff1a8;
      color: inherit;
    }

    .empty-state {
      padding: 54px 24px;
      border: 1px dashed #bcd8ef;
      border-radius: 20px;
      text-align: center;
      color: var(--muted);
      background: var(--blue-50);
      line-height: 1.8;
    }

    .empty-state strong {
      display: block;
      color: var(--blue-900);
      font-size: 17px;
    }

    .footer-note {
      margin-top: 16px;
      text-align: right;
      color: #8094a8;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 20px, 1120px); padding-top: 18px; }
      .hero { grid-template-columns: 1fr; padding: 30px 26px; }
      .character-wrap { justify-content: flex-start; }
      .character-card { width: 130px; height: 130px; border-radius: 22px; }
      .panel { padding: 18px; }
      .search-row { grid-template-columns: 1fr; }
      .reset-btn { width: 100%; }
      .result-header { align-items: center; }
      .faq-card { padding: 21px 20px 21px 23px; }
    }
  </style>
</head>

    ];

    const searchInput = document.getElementById("searchInput");
    const resetButton = document.getElementById("resetButton");
    const categoryButtons = document.querySelectorAll(".category-button");
    const faqList = document.getElementById("faqList");
    const resultCount = document.getElementById("resultCount");

    let selectedCategory = "전체";

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, keyword) {
      const safeText = escapeHtml(text);
      const trimmedKeyword = keyword.trim();
      if (!trimmedKeyword) return safeText;

      const regex = new RegExp(`(${escapeRegExp(trimmedKeyword)})`, "gi");
      return safeText.replace(regex, "<mark>$1</mark>");
    }

    function getFilteredFaqs() {
      const keyword = searchInput.value.trim().toLowerCase();

      return faqData.filter((item) => {
        const categoryMatched = selectedCategory === "전체" || item.category === selectedCategory;
        const targetText = `${item.question} ${item.answer}`.toLowerCase();
        const keywordMatched = keyword === "" || targetText.includes(keyword);
        return categoryMatched && keywordMatched;
      });
    }

    function renderFaqs() {
      const keyword = searchInput.value.trim();
      const filteredFaqs = getFilteredFaqs();

      resultCount.innerHTML = `총 <strong>${filteredFaqs.length}</strong>건`;

      if (filteredFaqs.length === 0) {
        faqList.innerHTML = `
          <div class="empty-state">
            <strong>검색 결과가 없습니다.</strong>
            제공된 FAQ 데이터에 해당하는 질문 또는 답변이 없습니다.
          </div>
        `;
        return;
      }

      faqList.innerHTML = filteredFaqs.map((item) => `
        <article class="faq-card">
          <span class="question-label">질문</span>
          <h3 class="faq-question">${highlight(item.question, keyword)}</h3>

          <span class="answer-label">답변</span>
          <p class="faq-answer">${highlight(item.answer, keyword)}</p>

          <span class="category-badge">${escapeHtml(item.category)}</span>
        </article>
      `).join("");
    }

    searchInput.addEventListener("input", renderFaqs);

    categoryButtons.forEach((button) => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;
        categoryButtons.forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        renderFaqs();
      });
    });

    resetButton.addEventListener("click", () => {
      searchInput.value = "";
      selectedCategory = "전체";
      categoryButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.category === "전체");
      });
      renderFaqs();
      searchInput.focus();
    });

    renderFaqs();
  </script>
